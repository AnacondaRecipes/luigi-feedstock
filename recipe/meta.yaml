{% set name = "luigi" %}
{% set version = "3.8.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2fa5eb5d3474e495de09bd964f502936c08f8b1eb6e0f3ca3c8a69116c38d0c3

build:
  number: 0
  skip: true  # [py<310 or py>=314]
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  entry_points:
    - luigi = luigi.cmdline:luigi_run
    - luigid = luigi.cmdline:luigid
    - luigi-grep = luigi.tools.luigi_grep:main
    - luigi-deps = luigi.tools.deps:main
    - luigi-deps-tree = luigi.tools.deps_tree:main

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python
    - python-dateutil >=2.7.5,<3
    - tenacity >=9
    - tornado >=5.0,<7
    - python-daemon  # [not win]
    - python-daemon <2.2.0  # [win]
    - typing-extensions >=4.12.2
  run_constrained:
    # prometheus
    - prometheus_client >=0.5,<0.15
    # toml
    - toml <2.0.0

test:
  source_files:
    - test
  imports:
    - luigi
    - luigi.configuration
    - luigi.contrib
    - luigi.contrib.hdfs
    - luigi.tools
    - luigi.scheduler
  requires:
    - pip
    - pytest
  commands:
    - luigi --help
    - luigid --help
    - luigi-grep --help
    - luigi-deps --help
    - luigi-deps-tree --help
    - pip check  # [not win]
    - pytest -v test/most_common_test.py test/import_test.py

about:
  home: https://github.com/spotify/luigi
  license_file: LICENSE
  license: Apache-2.0
  license_family: Apache
  summary: Workflow mgmgt + task scheduling + dependency resolution.
  description: |
    Luigi handles dependency resolution, workflow management, visualization,
    handling failures, command line integration, and much more. It also comes
    with Hadoop support built in.
  dev_url: https://github.com/spotify/luigi
  doc_url: https://luigi.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox
    - nehaljwani
